<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さーさもん＆うるふたんのゆるふわ森の大冒険</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #eef5e6;
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* スケッチブック風のフレーム */
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 960px;
    height: 100%;
    max-height: 600px;
    background: #f5faef;
    border: 4px solid #2b2623;
    border-radius: 18px;
    box-shadow: 6px 6px 0px #2b2623;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 768px) {
    #game-wrapper {
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* UI オーバーレイ共通 */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(247, 253, 242, 0.93);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
    text-align: center;
  }

  .hidden {
    display: none !important;
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    font-weight: 900;
    color: #2b2623;
    margin: 0 0 8px 0;
    text-shadow: 2px 2px 0px #a3e496;
    letter-spacing: 0.04em;
  }

  .subtitle {
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: #4b5748;
    margin-bottom: 16px;
    font-weight: 700;
  }

  /* キャラ選択カード */
  .char-select-container {
    display: flex;
    gap: 16px;
    justify-content: center;
    width: 100%;
    max-width: 680px;
    margin-bottom: 16px;
  }

  .char-card {
    flex: 1;
    background: #ffffff;
    border: 3px solid #2b2623;
    border-radius: 16px;
    padding: 12px 10px;
    cursor: pointer;
    box-shadow: 4px 4px 0px #2b2623;
    transition: transform 0.12s, background-color 0.12s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .char-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px #2b2623;
  }

  .char-card:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px #2b2623;
  }

  .char-card.sasamon:hover { background: #fff0f7; }
  .char-card.wolfutan:hover { background: #eef9ff; }

  .char-preview {
    width: 110px;
    height: 120px;
    margin-bottom: 6px;
  }

  .char-name {
    font-size: 1.25rem;
    font-weight: 900;
    color: #2b2623;
    margin-bottom: 4px;
  }

  .char-desc {
    font-size: 0.78rem;
    color: #4a433f;
    line-height: 1.4;
    font-weight: 700;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 0.72rem;
    font-weight: 900;
    border: 2px solid #2b2623;
    margin-top: 6px;
  }

  .badge-pink { background: #ff9ed2; color: #2b2623; }
  .badge-blue { background: #9de0ff; color: #2b2623; }

  /* 汎用手描き風ボタン */
  .sketch-btn {
    background: #ffe066;
    color: #2b2623;
    border: 3px solid #2b2623;
    border-radius: 14px;
    padding: 10px 26px;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 4px 4px 0px #2b2623;
    transition: transform 0.1s;
    margin-top: 8px;
  }

  .sketch-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0px #2b2623;
  }

  /* サウンドボタン */
  #sound-toggle {
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 20;
    background: #ffffff;
    border: 2.5px solid #2b2623;
    border-radius: 12px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 2px 2px 0px #2b2623;
  }

  /* スマホ・タッチ操作用バーチャルパッド */
  #touch-controls {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 8;
  }

  .touch-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }

  .pad-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid #2b2623;
    box-shadow: 3px 3px 0px rgba(43, 38, 35, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 900;
    color: #2b2623;
    touch-action: none;
  }

  .pad-btn.active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px #2b2623;
    background: #ffe066;
  }

  .pad-btn.atk,
  .pad-btn.jmp {
    width: 68px;
    height: 68px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
    white-space: nowrap;
    flex: 0 0 68px;
  }

  .pad-btn.atk {
    background: rgba(255, 179, 217, 0.92);
    font-size: 0.9rem;
  }

  .pad-btn.jmp {
    background: rgba(168, 230, 207, 0.92);
    font-size: 0.9rem;
  }

  .controls-hint {
    font-size: 0.78rem;
    color: #546350;
    font-weight: 700;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <button id="sound-toggle" title="BGM・効果音切替">🔊 音 ON</button>
  <canvas id="gameCanvas"></canvas>

  <!-- タイトル・キャラクター選択画面 -->
  <div id="title-screen" class="overlay">
    <h1>さーさもん＆うるふたんの<br>ゆるふわ森の大冒険</h1>
    <div class="subtitle">あそぶキャラクターをえらんでね！</div>

    <div class="char-select-container">
      <div class="char-card sasamon" onclick="startGame('sasamon')">
        <canvas id="preview-sasamon" class="char-preview" width="140" height="150"></canvas>
        <div class="char-name">さーさもん</div>
        <div class="char-desc">
          渦巻きピンク髪＆緑のスリッパ！<br>
          遠距離「スリッパビーム」で攻撃！
        </div>
        <span class="badge badge-pink">スピード＆遠距離</span>
      </div>

      <div class="char-card wolfutan" onclick="startGame('wolfutan')">
        <canvas id="preview-wolfutan" class="char-preview" width="140" height="150"></canvas>
        <div class="char-name">うるふたん</div>
        <div class="char-desc">
          50gの髪飾り＆しなるバーベル！<br>
          豪快「バーベルスイング」で粉砕！
        </div>
        <span class="badge badge-blue">パワー＆衝撃波</span>
      </div>
    </div>

    <div class="controls-hint">
      PC操作: [←→ / AD] 移動 ・ [↑ / W / Space] ジャンプ(2段可) ・ [Z / Enter / Shift] こうげき
    </div>
  </div>

  <!-- ステージクリア・ゲームオーバー・エンディング画面 -->
  <div id="result-screen" class="overlay hidden">
    <h1 id="result-title">ステージクリア！</h1>
    <div id="result-msg" class="subtitle">相棒がゴールで待っていたよ！</div>
    <div id="result-score" style="font-size:1.3rem; font-weight:900; color:#2b2623; margin-bottom:12px;"></div>
    <button id="result-btn" class="sketch-btn">つぎのステージへ</button>
  </div>

  <!-- タッチ操作バーチャルパッド -->
  <div id="touch-controls" class="hidden">
    <div class="touch-group">
      <div class="pad-btn" id="btn-left">◀</div>
      <div class="pad-btn" id="btn-right">▶</div>
    </div>
    <div class="touch-group">
      <div class="pad-btn atk" id="btn-atk">こうげき</div>
      <div class="pad-btn jmp" id="btn-jmp">ジャンプ</div>
    </div>
  </div>
</div>

<script>
/**
 * ============================================================================
 * 1. Web Audio API レトロ＆可愛いシンセサイザー
 * ============================================================================
 */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.isPlayingBgm = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    const btn = document.getElementById('sound-toggle');
    btn.textContent = this.muted ? '🔇 音 OFF' : '🔊 音 ON';
    if (this.muted) {
      this.stopBgm();
    } else if (gameState === 'PLAYING') {
      this.startBgm();
    }
  }

  playTone(freq, type, duration, vol = 0.12, slideTo = null) {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    }
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  seJump(isDouble = false) {
    if (isDouble) {
      this.playTone(420, 'sine', 0.18, 0.14, 780);
    } else {
      this.playTone(280, 'triangle', 0.15, 0.14, 540);
    }
  }

  seBeam() {
    this.playTone(760, 'square', 0.14, 0.08, 320);
  }

  seSwing() {
    this.playTone(180, 'sawtooth', 0.18, 0.12, 90);
  }

  seHit() {
    this.playTone(220, 'square', 0.12, 0.12, 110);
  }

  seItem() {
    this.playTone(587.33, 'sine', 0.09, 0.12);
    setTimeout(() => this.playTone(880, 'sine', 0.16, 0.12), 65);
  }

  seDamage() {
    this.playTone(190, 'sawtooth', 0.28, 0.15, 75);
  }

  seClear() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, i) => {
      setTimeout(() => this.playTone(n, 'triangle', 0.25, 0.14), i * 110);
    });
  }

  startBgm() {
    if (this.muted || this.isPlayingBgm) return;
    this.init();
    this.isPlayingBgm = true;
    this.bgmStep = 0;
    const melody = [
      523.25, 0, 659.25, 783.99, 659.25, 0, 587.33, 523.25,
      587.33, 0, 659.25, 587.33, 523.25, 0, 392.00, 0,
      523.25, 0, 659.25, 783.99, 880.00, 783.99, 659.25, 523.25,
      587.33, 659.25, 587.33, 493.88, 523.25, 0, 0, 0
    ];
    this.bgmTimer = setInterval(() => {
      if (this.muted || gameState !== 'PLAYING') return;
      const freq = melody[this.bgmStep % melody.length];
      if (freq > 0) {
        this.playTone(freq, 'triangle', 0.16, 0.045);
      }
      if (this.bgmStep % 4 === 0) {
        this.playTone(130.81, 'sine', 0.15, 0.05);
      }
      this.bgmStep++;
    }, 190);
  }

  stopBgm() {
    this.isPlayingBgm = false;
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }
}

const sound = new SoundEngine();
document.getElementById('sound-toggle').addEventListener('click', () => sound.toggleMute());

/**
 * ============================================================================
 * 2. キャラクター高精度ベクター描画エンジン
 * ============================================================================
 */
function strokeAndFill(ctx, fillStyle, lineWidth = 2.4) {
  if (fillStyle) {
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }
  ctx.lineWidth = lineWidth;
  ctx.strokeStyle = '#1f1b18';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
}

/**
 * さーさもん描画
 */
function drawSasamon(ctx, x, y, scale, facing, animTime, isAttacking, state) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * facing, scale);

  const walkCycle = state === 'RUN' ? Math.sin(animTime * 14) : 0;
  const bob = state === 'RUN' ? Math.abs(Math.cos(animTime * 14)) * 3 : Math.sin(animTime * 3) * 1.5;

  const leftLegY = walkCycle * 5;
  const rightLegY = -walkCycle * 5;

  ctx.beginPath();
  ctx.rect(-13, 18 + leftLegY * 0.4, 7, 22);
  strokeAndFill(ctx, '#ffe2c6', 2.2);

  ctx.beginPath();
  ctx.rect(6, 18 + rightLegY * 0.4, 7, 22);
  strokeAndFill(ctx, '#ffe2c6', 2.2);

  const drawCreatureSlipper = (sx, sy) => {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.beginPath();
    ctx.moveTo(-5, -4); ctx.lineTo(-10, -12);
    ctx.moveTo(5, -4); ctx.lineTo(10, -12);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = '#1f1b18';
    ctx.stroke();

    ctx.beginPath(); ctx.arc(-11, -13, 3, 0, Math.PI * 2); strokeAndFill(ctx, '#95e89b', 2);
    ctx.beginPath(); ctx.arc(11, -13, 3, 0, Math.PI * 2); strokeAndFill(ctx, '#95e89b', 2);

    ctx.beginPath();
    ctx.ellipse(0, 2, 12, 8.5, 0, 0, Math.PI * 2);
    strokeAndFill(ctx, '#95e89b', 2.2);

    ctx.fillStyle = '#1f1b18';
    ctx.beginPath(); ctx.arc(-4, 1, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, 1, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(-1.8, 3.5, 1.8, 0, Math.PI);
    ctx.arc(1.8, 3.5, 1.8, 0, Math.PI);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  };

  drawCreatureSlipper(-10, 42 + leftLegY * 0.5);
  drawCreatureSlipper(10, 42 + rightLegY * 0.5);

  ctx.translate(0, -bob);

  // 左腕
  ctx.beginPath();
  ctx.moveTo(-14, -6);
  ctx.lineTo(-27, 2);
  ctx.lineTo(-33, -12);
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#1f1b18';
  ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffe2c6';
  ctx.stroke();
  ctx.beginPath(); ctx.arc(-33, -14, 5, 0, Math.PI * 2); strokeAndFill(ctx, '#ffe2c6', 2.2);

  // 右腕
  ctx.beginPath();
  ctx.moveTo(14, -6);
  if (isAttacking) {
    ctx.lineTo(30, -6);
    ctx.lineTo(42, -8);
  } else {
    ctx.lineTo(27, 2);
    ctx.lineTo(33, -12);
  }
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#1f1b18';
  ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#ffe2c6';
  ctx.stroke();
  const fistX = isAttacking ? 43 : 33;
  const fistY = isAttacking ? -8 : -14;
  ctx.beginPath(); ctx.arc(fistX, fistY, 5, 0, Math.PI * 2); strokeAndFill(ctx, '#ffe2c6', 2.2);

  // インナー
  ctx.beginPath();
  ctx.roundRect(-15, -12, 30, 34, 6);
  strokeAndFill(ctx, '#c5f29b', 2.2);

  // エプロン
  ctx.beginPath();
  ctx.moveTo(-11, -11); ctx.lineTo(-11, -2);
  ctx.moveTo(11, -11); ctx.lineTo(11, -2);
  ctx.moveTo(-14, -2);
  ctx.lineTo(14, -2);
  ctx.lineTo(21, 10);
  ctx.lineTo(17, 13);
  ctx.lineTo(20, 17);
  ctx.quadraticCurveTo(0, 22, -20, 17);
  ctx.lineTo(-17, 13);
  ctx.lineTo(-21, 10);
  ctx.closePath();
  strokeAndFill(ctx, '#f2b866', 2.2);

  ctx.save();
  ctx.setLineDash([2, 2]);
  ctx.beginPath(); ctx.arc(-6, 8, 4.5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(6, 8, 4.5, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#1f1b18';
  ctx.beginPath(); ctx.arc(-6, 8, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(6, 8, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.arc(-1.8, 13, 1.8, 0, Math.PI);
  ctx.arc(1.8, 13, 1.8, 0, Math.PI);
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // 後ろ髪
  ctx.beginPath();
  ctx.arc(0, -28, 23, Math.PI * 0.85, Math.PI * 2.15);
  ctx.quadraticCurveTo(28, -14, 18, -10);
  ctx.lineTo(-18, -10);
  ctx.quadraticCurveTo(-28, -14, -21, -22);
  strokeAndFill(ctx, '#ff9ec7', 2.4);

  // 左渦巻き
  ctx.beginPath();
  ctx.moveTo(-6, -48);
  ctx.bezierCurveTo(-26, -68, -36, -42, -16, -42);
  ctx.bezierCurveTo(-8, -42, -10, -52, -16, -50);
  ctx.lineWidth = 6.5;
  ctx.strokeStyle = '#1f1b18';
  ctx.stroke();
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = '#ff9ec7';
  ctx.stroke();
  ctx.beginPath(); ctx.arc(-15, -49, 4.5, 0, Math.PI * 2); strokeAndFill(ctx, '#ff73ad', 2);

  // 右渦巻き
  ctx.beginPath();
  ctx.moveTo(6, -48);
  ctx.bezierCurveTo(26, -68, 36, -42, 16, -42);
  ctx.bezierCurveTo(8, -42, 10, -52, 16, -50);
  ctx.lineWidth = 6.5;
  ctx.strokeStyle = '#1f1b18';
  ctx.stroke();
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = '#ff9ec7';
  ctx.stroke();
  ctx.beginPath(); ctx.arc(15, -49, 4.5, 0, Math.PI * 2); strokeAndFill(ctx, '#ff73ad', 2);

  // 顔
  ctx.beginPath();
  ctx.roundRect(-14, -36, 28, 22, 9);
  strokeAndFill(ctx, '#ffe2c6', 2.2);

  // 前髪
  ctx.beginPath();
  ctx.moveTo(-16, -34);
  ctx.quadraticCurveTo(0, -42, 16, -34);
  ctx.lineTo(13, -29);
  ctx.lineTo(5, -32);
  ctx.lineTo(0, -29);
  ctx.lineTo(-6, -32);
  ctx.lineTo(-13, -29);
  ctx.closePath();
  strokeAndFill(ctx, '#ff9ec7', 2.2);

  // メガネ
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#1f1b18';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-12, -30, 10, 9, 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(2, -30, 10, 9, 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2, -26); ctx.lineTo(2, -26); ctx.stroke();

  ctx.fillStyle = '#1f1b18';
  ctx.beginPath(); ctx.ellipse(-6.5, -25.5, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6.5, -25.5, 2, 3, 0, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath();
  ctx.ellipse(0, -18, 4.5, 2.2, 0, 0, Math.PI * 2);
  strokeAndFill(ctx, '#ff9d5c', 1.6);

  ctx.restore();
}

/**
 * うるふたん描画
 */
function drawWolfutan(ctx, x, y, scale, facing, animTime, isAttacking, state) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * facing, scale);

  const walkCycle = state === 'RUN' ? Math.sin(animTime * 13) : 0;
  const bob = state === 'RUN' ? Math.abs(Math.cos(animTime * 13)) * 2.5 : Math.sin(animTime * 2.8) * 1.2;

  const leftLegY = walkCycle * 4.5;
  const rightLegY = -walkCycle * 4.5;

  ctx.beginPath(); ctx.rect(-11, 20 + leftLegY * 0.3, 6.5, 16); strokeAndFill(ctx, '#ffe2c6', 2.2);
  ctx.beginPath(); ctx.rect(4.5, 20 + rightLegY * 0.3, 6.5, 16); strokeAndFill(ctx, '#ffe2c6', 2.2);

  const drawFluffyBoot = (bx, by) => {
    ctx.beginPath();
    ctx.moveTo(bx - 5, by);
    ctx.lineTo(bx + 5, by);
    ctx.lineTo(bx + 7, by + 13);
    ctx.lineTo(bx - 6, by + 13);
    ctx.closePath();
    strokeAndFill(ctx, '#f7a8e0', 2.2);
  };
  drawFluffyBoot(-8, 33 + leftLegY * 0.4);
  drawFluffyBoot(8, 33 + rightLegY * 0.4);

  ctx.translate(0, -bob);

  const drawTwinTail = (side) => {
    ctx.save();
    ctx.scale(side, 1);

/**
 * 添付画像キャラクター忠実再現ボス描画（森のタヌキ大将）
 * 画像の特徴：
 * - 大きな太いしっぽ（左側へ大きく跳ね上がる曲線シルエット）
 * - ガニ股で踏ん張る2本の足、両脇に少し広げた腕
 * - ふっくらした輪郭の頭に左右3段のギザギザ頬毛、顎下の3連ギザギザ毛
 * - 丸みを帯びた台形っぽい大きな耳＋内側の耳枠線
 * - への字の垂れ眉、小さな点目、目の下の「V」字（クマ/頬の線）、
 *   鼻の点、への字の口、その下の短い横線
 */
function drawTanukiBoss(ctx, x, y, animTime, hitFlash, hp, maxHp, facing) {
  ctx.save();
  ctx.translate(x, y);
  const bob = Math.sin(animTime * 4.5) * 3;
  const stepTilt = Math.sin(animTime * 7) * 0.04;
  ctx.translate(0, bob);

  if (hitFlash > 0) ctx.globalAlpha = 0.55;

  // HPバー＆名前ラベル（向き反転の影響を受けないよう先に描画）
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-52, -142, 104, 12);
  ctx.fillStyle = '#ff6b8b';
  ctx.fillRect(-52, -142, 104 * Math.max(0, hp / maxHp), 12);
  ctx.strokeStyle = '#1f1b18';
  ctx.lineWidth = 2.2;
  ctx.strokeRect(-52, -142, 104, 12);

  ctx.fillStyle = '#1f1b18';
  ctx.font = '900 13px "Zen Maru Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('しみずっち', 0, -150);
  ctx.restore();

  // キャラクター本体（向きと揺れを適用）
  ctx.scale(facing, 1);
  ctx.rotate(stepTilt);

  const lineW = 3.6;

  // 1. 大きなしっぽ（画像左下〜左へ跳ね上がる太いしっぽ）
  ctx.beginPath();
  ctx.moveTo(-36, 12);
  ctx.quadraticCurveTo(-78, 22, -98, -22);
  ctx.quadraticCurveTo(-116, 14, -108, 36);
  ctx.quadraticCurveTo(-84, 52, -44, 34);
  ctx.closePath();
  strokeAndFill(ctx, '#ffffff', lineW);

  // 2. 胴体・腕・ガニ股の足（画像の一体シルエットを忠実再現）
  ctx.beginPath();
  // 左肩〜左腕
  ctx.moveTo(-26, -32);
  ctx.quadraticCurveTo(-52, -20, -64, 4);
  ctx.quadraticCurveTo(-48, 4, -32, -3);
  // 左脇〜左足（ガニ股）
  ctx.quadraticCurveTo(-40, 20, -34, 34);
  ctx.quadraticCurveTo(-58, 40, -62, 62);
  ctx.quadraticCurveTo(-68, 66, -60, 69);
  ctx.quadraticCurveTo(-48, 70, -45, 62);
  ctx.quadraticCurveTo(-44, 46, -16, 46);
  // お腹の下カーブ
  ctx.quadraticCurveTo(2, 52, 22, 43);
  // 右足（ガニ股）
  ctx.quadraticCurveTo(38, 52, 42, 72);
  ctx.quadraticCurveTo(40, 77, 50, 77);
  ctx.quadraticCurveTo(60, 76, 56, 69);
  ctx.quadraticCurveTo(50, 66, 48, 56);
  ctx.quadraticCurveTo(46, 38, 36, 26);
  // 右脇〜右腕
  ctx.quadraticCurveTo(45, 14, 42, 0);
  ctx.quadraticCurveTo(58, 12, 74, 24);
  ctx.quadraticCurveTo(78, 20, 72, 4);
  ctx.quadraticCurveTo(60, -18, 34, -30);
  ctx.closePath();
  strokeAndFill(ctx, '#ffffff', lineW);

  // お腹の境目ライン（画像の左足付け根〜お腹の抜け感表現）
  ctx.beginPath();
  ctx.moveTo(-22, 44);
  ctx.quadraticCurveTo(-2, 52, 16, 46);
  ctx.lineWidth = lineW;
  ctx.strokeStyle = '#1f1b18';
  ctx.stroke();

  // 3. 頭部シルエット（大きな耳＋頬の3段ギザギザ＋顎下のギザギザ）
  ctx.beginPath();
  // 頭頂カーブ
  ctx.moveTo(-24, -92);
  ctx.quadraticCurveTo(0, -102, 24, -92);
  // 右耳（台形丸み）
  ctx.lineTo(35, -112);
  ctx.quadraticCurveTo(48, -114, 58, -110);
  ctx.quadraticCurveTo(60, -94, 56, -84);
  ctx.lineTo(42, -77);
  // 右頬の3段ギザギザ毛
  ctx.quadraticCurveTo(50, -68, 50, -60);
  ctx.lineTo(60, -56);
  ctx.lineTo(52, -51);
  ctx.lineTo(62, -47);
  ctx.lineTo(52, -42);
  ctx.lineTo(60, -38);
  // 右顎〜顎下の3連ギザギザ毛
  ctx.quadraticCurveTo(38, -28, 14, -27);
  ctx.lineTo(10, -20);
  ctx.lineTo(5, -26);
  ctx.lineTo(0, -20);
  ctx.lineTo(-5, -26);
  ctx.lineTo(-9, -20);
  ctx.lineTo(-14, -27);
  // 左頬の3段ギザギザ毛
  ctx.quadraticCurveTo(-38, -29, -56, -39);
  ctx.lineTo(-47, -43);
  ctx.lineTo(-57, -48);
  ctx.lineTo(-47, -52);
  ctx.lineTo(-56, -57);
  ctx.quadraticCurveTo(-48, -66, -42, -76);
  // 左耳（台形丸み）
  ctx.lineTo(-56, -84);
  ctx.quadraticCurveTo(-58, -98, -53, -111);
  ctx.quadraticCurveTo(-42, -113, -32, -112);
  ctx.closePath();
  strokeAndFill(ctx, '#ffffff', lineW);

  // 耳の内側の線（画像の「コ」の字型の内枠）
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = '#1f1b18';
  // 左耳内側
  ctx.beginPath();
  ctx.moveTo(-38, -84);
  ctx.lineTo(-46, -90);
  ctx.lineTo(-45, -100);
  ctx.lineTo(-35, -100);
  ctx.lineTo(-32, -92);
  ctx.stroke();
  // 右耳内側
  ctx.beginPath();
  ctx.moveTo(35, -92);
  ctx.lineTo(39, -100);
  ctx.lineTo(48, -99);
  ctx.lineTo(47, -89);
  ctx.lineTo(41, -84);
  ctx.stroke();

  // 4. 顔のパーツ（画像のシュールで味のある表情をそのまま再現）
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1f1b18';
  ctx.fillStyle = '#1f1b18';

  // 左眉（アーチ型）
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(-16, -68);
  ctx.quadraticCurveTo(-10, -76, -5, -69);
  ctx.stroke();

  // 右眉（アーチ型）
  ctx.beginPath();
  ctx.moveTo(11, -69);
  ctx.quadraticCurveTo(17, -75, 23, -68);
  ctx.stroke();

  // 小さな点目
  ctx.beginPath();
  ctx.arc(-10, -62, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(16, -62, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // 目の下の「V」字ライン
  ctx.lineWidth = 2.3;
  ctx.beginPath();
  ctx.moveTo(-14, -56);
  ctx.lineTo(-10, -52);
  ctx.lineTo(-6, -56);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(12, -55);
  ctx.lineTo(16, -51);
  ctx.lineTo(20, -55);
  ctx.stroke();

  // 鼻（小さな丸点）
  ctx.beginPath();
  ctx.arc(2.5, -58, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // への字口
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-2, -50);
  ctx.lineTo(2.5, -54);
  ctx.lineTo(7, -50);
  ctx.stroke();

  // 口の下の短い横線（顎のしわ）
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(1, -46);
  ctx.lineTo(4, -46);
  ctx.stroke();

  ctx.restore();
}

const keys = {
  left: false,
  right: false,
  jump: false,
  attack: false
};

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) {
    if (!keys.jump && gameState === 'PLAYING') player.triggerJump();
    keys.jump = true;
  }
  if (['KeyZ', 'Enter', 'ShiftLeft', 'ShiftRight', 'KeyJ'].includes(e.code)) {
    if (!keys.attack && gameState === 'PLAYING') player.triggerAttack();
    keys.attack = true;
  }
});

window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = false;
  if (['KeyZ', 'Enter', 'ShiftLeft', 'ShiftRight', 'KeyJ'].includes(e.code)) keys.attack = false;
});

function bindTouchBtn(id, keyName, onPress) {
  const el = document.getElementById(id);
  const start = (e) => {
    e.preventDefault();
    keys[keyName] = true;
    el.classList.add('active');
    if (onPress && gameState === 'PLAYING') onPress();
  };
  const end = (e) => {
    e.preventDefault();
    keys[keyName] = false;
    el.classList.remove('active');
  };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

bindTouchBtn('btn-left', 'left');
bindTouchBtn('btn-right', 'right');
bindTouchBtn('btn-jmp', 'jump', () => player.triggerJump());
bindTouchBtn('btn-atk', 'attack', () => player.triggerAttack());

const player = {
  x: 80,
  y: 200,
  vx: 0,
  vy: 0,
  width: 38,
  height: 76,
  facing: 1,
  grounded: false,
  jumpCount: 0,
  hp: 5,
  maxHp: 5,
  invulnTimer: 0,
  attackTimer: 0,
  attackCooldown: 0,
  powerLevel: 1,

  reset(stageStartY) {
    this.x = 80;
    this.y = stageStartY - 60;
    this.vx = 0;
    this.vy = 0;
    this.facing = 1;
    this.grounded = false;
    this.jumpCount = 0;
    this.invulnTimer = 0;
    this.attackTimer = 0;
    this.attackCooldown = 0;
  },

  triggerJump() {
    if (this.grounded || this.jumpCount < 2) {
      const isDouble = !this.grounded && this.jumpCount === 1;
      this.vy = isDouble ? -12.5 : -13.8;
      this.grounded = false;
      this.jumpCount++;
      sound.seJump(isDouble);
      spawnParticles(this.x, this.y + 45, isDouble ? '#ff9ec7' : '#d8d0c5', 7);
    }
  },

  triggerAttack() {
    if (this.attackCooldown > 0) return;
    this.attackTimer = 0.25;
    if (selectedChar === 'sasamon') {
      this.attackCooldown = 0.28;
      sound.seBeam();
      const beamCount = this.powerLevel >= 2 ? 2 : 1;
      for (let i = 0; i < beamCount; i++) {
        projectiles.push({
          x: this.x + this.facing * 28,
          y: this.y - 6 + (i * 16 - (beamCount - 1) * 8),
          vx: this.facing * 11.5,
          vy: 0,
          type: 'SLIPPER_BEAM',
          life: 0.75,
          damage: 1
        });
      }
    } else {
      this.attackCooldown = 0.36;
      sound.seSwing();
      projectiles.push({
        x: this.x + this.facing * 42,
        y: this.y + 4,
        vx: this.facing * (this.powerLevel >= 2 ? 8.5 : 4.5),
        vy: 0,
        type: 'BARBELL_WAVE',
        life: this.powerLevel >= 2 ? 0.55 : 0.26,
        damage: 2
      });
    }
  },

  damage(amount = 1) {
    if (this.invulnTimer > 0) return;
    this.hp -= amount;
    this.invulnTimer = 1.2;
    this.vy = -7;
    sound.seDamage();
    spawnParticles(this.x, this.y, '#ff5964', 12);
    if (this.hp <= 0) {
      endStage(false);
    }
  }
};

function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      color,
      size: 3 + Math.random() * 4,
      life: 0.4 + Math.random() * 0.3
    });
  }
}

function createEnemy(type, x, y, minX, maxX) {
  return {
    type,
    x,
    y,
    vx: type === 'DUMBBELL' ? -2.4 : -1.5,
    vy: 0,
    minX,
    maxX,
    hp: type === 'DUMBBELL' ? 2 : 1,
    hitFlash: 0
  };
}

/**
 * ============================================================================
 * 4. ゲーム開始・進行・リザルト制御
 * ============================================================================
 */
function startGame(charName) {
  selectedChar = charName;
  currentStage = 1;
  score = 0;
  player.maxHp = 5;
  player.hp = 5;
  player.powerLevel = 1;

  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('touch-controls').classList.remove('hidden');

  buildStage(currentStage);
  gameState = 'PLAYING';
  sound.init();
  sound.startBgm();
}

function endStage(isWin) {
  gameState = 'RESULT';
  sound.stopBgm();
  document.getElementById('touch-controls').classList.add('hidden');

  const resScreen = document.getElementById('result-screen');
  const resTitle = document.getElementById('result-title');
  const resMsg = document.getElementById('result-msg');
  const resScore = document.getElementById('result-score');
  const resBtn = document.getElementById('result-btn');

  const partnerName = selectedChar === 'sasamon' ? 'うるふたん' : 'さーさもん';
  resScreen.classList.remove('hidden');

  if (!isWin) {
    resTitle.textContent = 'やられちゃった…！';
    resMsg.textContent = `${partnerName}が森の切り株で心配そうに見ているよ！`;
    resScore.textContent = `スコア: ${score} pts`;
    resBtn.textContent = 'もういちど挑戦する';
    resBtn.onclick = () => {
      player.hp = player.maxHp;
      resScreen.classList.add('hidden');
      document.getElementById('touch-controls').classList.remove('hidden');
      buildStage(currentStage);
      gameState = 'PLAYING';
      sound.startBgm();
    };
  } else if (currentStage < MAX_STAGES) {
    sound.seClear();
    score += 500;
    resTitle.textContent = `ステージ ${currentStage} クリア！`;
    resMsg.textContent = `森の奥で待っていた${partnerName}とハイタッチ！`;
    resScore.textContent = `現在のスコア: ${score} pts`;
    resBtn.textContent = 'つぎのステージへ';
    resBtn.onclick = () => {
      currentStage++;
      player.hp = Math.min(player.maxHp, player.hp + 2);
      resScreen.classList.add('hidden');
      document.getElementById('touch-controls').classList.remove('hidden');
      buildStage(currentStage);
      gameState = 'PLAYING';
      sound.startBgm();
    };
  } else {
    sound.seClear();
    score += 1500;
    resTitle.textContent = '🎉 全ステージ完全クリア！ 🎉';
    resMsg.textContent = `しみずっちを退け、さーさもん＆うるふたんが森の平和を守ったよ！`;
    resScore.textContent = `最終スコア: ${score} pts`;
    resBtn.textContent = 'タイトルにもどる';
    resBtn.onclick = () => {
      resScreen.classList.add('hidden');
      document.getElementById('title-screen').classList.remove('hidden');
      gameState = 'TITLE';
    };
  }
}

/**
 * ============================================================================
 * 5. 物理演算・更新処理
 * ============================================================================
 */
function update(dt) {
  if (gameState !== 'PLAYING') return;
  globalTime += dt;

  const groundY = canvas.height - 68;

  const moveSpeed = selectedChar === 'sasamon' ? 5.6 : 4.9;
  if (keys.left) {
    player.vx = -moveSpeed;
    player.facing = -1;
  } else if (keys.right) {
    player.vx = moveSpeed;
    player.facing = 1;
  } else {
    player.vx *= 0.78;
    if (Math.abs(player.vx) < 0.2) player.vx = 0;
  }

  player.vy += 0.65;
  if (player.vy > 16) player.vy = 16;

  player.x += player.vx;
  if (player.x < 25) player.x = 25;

  const prevBottom = player.y + 48;
  player.y += player.vy;
  const currBottom = player.y + 48;

  player.grounded = false;
  for (const p of platforms) {
    if (player.vy >= 0 &&
        player.x + 14 > p.x &&
        player.x - 14 < p.x + p.w &&
        prevBottom <= p.y + 12 &&
        currBottom >= p.y) {
      player.y = p.y - 48;
      player.vy = 0;
      player.grounded = true;
      player.jumpCount = 0;
    }
  }

  if (player.y > canvas.height + 80) {
    player.hp = 0;
    endStage(false);
    return;
  }

  if (player.invulnTimer > 0) player.invulnTimer -= dt;
  if (player.attackTimer > 0) player.attackTimer -= dt;
  if (player.attackCooldown > 0) player.attackCooldown -= dt;

  const targetCamX = player.x - canvas.width * 0.35;
  cameraX += (targetCamX - cameraX) * 0.12;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > goalX + 260 - canvas.width) {
    cameraX = Math.max(0, goalX + 260 - canvas.width);
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const proj = projectiles[i];
    proj.x += proj.vx;
    proj.y += proj.vy;
    proj.life -= dt;
    if (proj.life <= 0) {
      projectiles.splice(i, 1);
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx;
    if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
    if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
    if (e.hitFlash > 0) e.hitFlash -= dt;

    if (e.type === 'PYON') {
      e.vy += 0.45;
      e.y += e.vy;
      for (const p of platforms) {
        if (e.vy >= 0 && e.x > p.x && e.x < p.x + p.w && e.y + 22 >= p.y && e.y + 22 <= p.y + 25) {
          e.y = p.y - 22;
          e.vy = -8.5;
        }
      }
    }

    let defeated = false;
    for (let j = projectiles.length - 1; j >= 0; j--) {
      const proj = projectiles[j];
      if (Math.abs(proj.x - e.x) < 34 && Math.abs(proj.y - e.y) < 34) {
        e.hp -= proj.damage;
        e.hitFlash = 0.15;
        sound.seHit();
        spawnParticles(e.x, e.y, '#ffe066', 6);
        if (proj.type === 'SLIPPER_BEAM') {
          projectiles.splice(j, 1);
        }
        if (e.hp <= 0) {
          defeated = true;
          score += 150;
          spawnParticles(e.x, e.y, '#ff9ec7', 12);
          break;
        }
      }
    }
    if (defeated) {
      enemies.splice(i, 1);
      continue;
    }

    if (Math.abs(player.x - e.x) < 28 && Math.abs(player.y + 10 - e.y) < 36) {
      if (player.vy > 1 && player.y + 20 < e.y) {
        player.vy = -10.5;
        sound.seHit();
        score += 150;
        spawnParticles(e.x, e.y, '#95e89b', 12);
        enemies.splice(i, 1);
      } else {
        player.damage(1);
      }
    }
  }

  // ボス戦ロジック（ステージ3：タヌキ大将）
  if (boss && !boss.defeated) {
    boss.x += boss.vx;
    if (boss.x < boss.minX) { boss.x = boss.minX; boss.vx = Math.abs(boss.vx); }
    if (boss.x > boss.maxX) { boss.x = boss.maxX; boss.vx = -Math.abs(boss.vx); }
    if (boss.hitFlash > 0) boss.hitFlash -= dt;

    if (Math.abs(player.x - boss.x) < 650) {
      boss.attackTimer -= dt;
      if (boss.attackTimer <= 0) {
        boss.attackTimer = 2.1;
        const dir = player.x < boss.x ? -1 : 1;
        enemies.push(createEnemy('MOKO', boss.x + dir * 30, groundY - 26, boss.minX, boss.maxX));
      }
    }

    for (let j = projectiles.length - 1; j >= 0; j--) {
      const proj = projectiles[j];
      if (Math.abs(proj.x - boss.x) < 66 && Math.abs(proj.y - boss.y) < 76) {
        boss.hp -= proj.damage;
        boss.hitFlash = 0.12;
        sound.seHit();
        spawnParticles(proj.x, proj.y, '#ffe066', 7);
        if (proj.type === 'SLIPPER_BEAM') {
          projectiles.splice(j, 1);
        }
        if (boss.hp <= 0) {
          boss.defeated = true;
          score += 1000;
          sound.seClear();
          spawnParticles(boss.x, boss.y, '#a3e496', 32);
        }
      }
    }

    if (!boss.defeated && Math.abs(player.x - boss.x) < 58 && Math.abs(player.y - boss.y) < 68) {
      player.damage(1);
    }
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (Math.abs(player.x - it.x) < 32 && Math.abs(player.y - it.y) < 42) {
      sound.seItem();
      spawnParticles(it.x, it.y, '#ffe066', 10);
      if (it.type === 'CANDY') {
        score += 200;
      } else if (it.type === 'PROTEIN') {
        score += 300;
        player.powerLevel = 2;
      } else if (it.type === 'HEART') {
        score += 100;
        player.hp = Math.min(player.maxHp, player.hp + 1);
      }
      items.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.25;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  const canGoal = !boss || boss.defeated;
  if (canGoal && Math.abs(player.x - goalX) < 45) {
    endStage(true);
  }
}

/**
 * ============================================================================
 * 6. 豊かな森の背景描画＆ゲーム描画処理
 * ============================================================================
 */
function drawForestBackground(w, h) {
  // 空と森のグラデーション
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, stageTheme.skyTop || '#b8e8bc');
  grad.addColorStop(1, stageTheme.skyBottom || '#eaf7cf');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 斜めに差し込む木漏れ日の光の帯
  ctx.save();
  ctx.fillStyle = stageTheme.sunbeamColor || 'rgba(255, 252, 200, 0.26)';
  for (let i = 0; i < 5; i++) {
    const beamX = ((i * 260 - cameraX * 0.08) % (w + 300) + (w + 300)) % (w + 300) - 100;
    ctx.beginPath();
    ctx.moveTo(beamX, 0);
    ctx.lineTo(beamX + 85, 0);
    ctx.lineTo(beamX - 70, h);
    ctx.lineTo(beamX - 155, h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 最遠景：なだらかな森の丘シルエット
  ctx.save();
  ctx.fillStyle = stageTheme.farHill || '#95cc96';
  const hillStep = 320;
  const hillShift = (cameraX * 0.08) % hillStep;
  ctx.beginPath();
  ctx.moveTo(-hillStep, h);
  for (let hx = -hillStep - hillShift; hx < w + hillStep * 2; hx += hillStep) {
    ctx.quadraticCurveTo(hx + hillStep * 0.5, h - 220, hx + hillStep, h - 140);
  }
  ctx.lineTo(w + hillStep * 2, h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 中景・近景の森の木々（パララックス多層スクロール）
  const layers = [
    {
      speed: 0.18,
      baseY: h - 115,
      trunkColor: stageTheme.midTreeTrunk || '#755b43',
      leafColor: stageTheme.midTreeLeaf || '#6eb366',
      scale: 0.82,
      step: 190
    },
    {
      speed: 0.36,
      baseY: h - 68,
      trunkColor: stageTheme.nearTreeTrunk || '#59422e',
      leafColor: stageTheme.nearTreeLeaf || '#4e9649',
      scale: 1.08,
      step: 250
    }
  ];

  layers.forEach((layer, idx) => {
    const shift = (cameraX * layer.speed) % layer.step;
    const count = Math.ceil(w / layer.step) + 3;
    for (let i = -1; i < count; i++) {
      const tx = i * layer.step - shift + 40;
      const hash = Math.abs(Math.floor((cameraX * layer.speed + i * layer.step) / layer.step) + idx * 7);
      const treeH = (120 + (hash % 4) * 18) * layer.scale;
      const crownY = layer.baseY - treeH;
      const crownR = (44 + (hash % 3) * 7) * layer.scale;

      // 木の幹＆枝
      ctx.fillStyle = layer.trunkColor;
      ctx.strokeStyle = 'rgba(31, 27, 24, 0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(tx - 11 * layer.scale, crownY + 25 * layer.scale, 22 * layer.scale, treeH, 6);
      ctx.fill();
      ctx.stroke();

      // もこもこの樹冠（3つの円でボリューム表現）
      ctx.fillStyle = layer.leafColor;
      ctx.beginPath();
      ctx.arc(tx, crownY, crownR, 0, Math.PI * 2);
      ctx.arc(tx - crownR * 0.62, crownY + 18 * layer.scale, crownR * 0.74, 0, Math.PI * 2);
      ctx.arc(tx + crownR * 0.62, crownY + 18 * layer.scale, crownR * 0.74, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 木の葉の明るいハイライト
      ctx.fillStyle = 'rgba(235, 255, 195, 0.26)';
      ctx.beginPath();
      ctx.arc(tx - crownR * 0.25, crownY - crownR * 0.22, crownR * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // 根元の茂み＆小さなキノコ装飾（近景のみ）
      if (idx === 1) {
        ctx.fillStyle = '#68ab54';
        ctx.beginPath();
        ctx.arc(tx - 24, layer.baseY - 4, 16, Math.PI, 0);
        ctx.arc(tx + 22, layer.baseY - 4, 14, Math.PI, 0);
        ctx.fill();

        if (hash % 2 === 0) {
          // 可愛い森の赤キノコ
          const mx = tx + 36;
          const my = layer.baseY - 2;
          ctx.fillStyle = '#fff8eb';
          ctx.fillRect(mx - 3, my - 10, 6, 10);
          ctx.fillStyle = '#ff7b89';
          ctx.beginPath();
          ctx.arc(mx, my - 10, 9, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(mx - 3, my - 13, 1.8, 0, Math.PI * 2);
          ctx.arc(mx + 3, my - 12, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  });

  // 舞い散る森の葉っぱ・光の粒子
  for (let i = 0; i < 16; i++) {
    const leafX = ((i * 157 - cameraX * 0.25 + globalTime * 18) % (w + 120) + (w + 120)) % (w + 120) - 60;
    const leafY = 40 + ((i * 63 + Math.sin(globalTime * 2 + i) * 14) % Math.max(100, h - 160));
    ctx.save();
    ctx.translate(leafX, leafY);
    ctx.rotate(Math.sin(globalTime * 2.5 + i) * 0.6);
    ctx.fillStyle = i % 3 === 0 ? 'rgba(255, 250, 180, 0.45)' : 'rgba(130, 205, 110, 0.45)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 5, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const groundY = h - 68;

  // 森の背景描画
  drawForestBackground(w, h);

  if (gameState === 'TITLE') return;

  ctx.save();
  ctx.translate(-cameraX, 0);

  // --- 足場＆森の地面描画 ---
  for (const p of platforms) {
    if (p.x + p.w < cameraX - 50 || p.x > cameraX + w + 50) continue;

    if (p.isLog) {
      // 丸太風の浮遊足場
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 10);
      strokeAndFill(ctx, '#b07d4f', 2.6);

      // 木目ライン
      ctx.strokeStyle = '#7c5330';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(p.x + 12, p.y + 8);
      ctx.lineTo(p.x + p.w - 18, p.y + 8);
      ctx.moveTo(p.x + 22, p.y + 16);
      ctx.lineTo(p.x + p.w - 12, p.y + 16);
      ctx.stroke();

      // 丸太の切り口年輪
      ctx.beginPath();
      ctx.ellipse(p.x + p.w - 8, p.y + p.h / 2, 6, p.h / 2 - 2, 0, 0, Math.PI * 2);
      strokeAndFill(ctx, '#e6c39c', 2);
    } else {
      // 土の地面＋上の草むら層
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 12);
      strokeAndFill(ctx, stageTheme.soilFill || '#8a684a', 2.8);

      // 上部の緑の芝生層
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, 22, [12, 12, 4, 4]);
      strokeAndFill(ctx, stageTheme.groundFill || '#75b85b', 2.6);

      // 草のステッチ模様
      ctx.beginPath();
      ctx.moveTo(p.x + 10, p.y + 11);
      ctx.lineTo(p.x + p.w - 10, p.y + 11);
      ctx.setLineDash([8, 6]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(35, 65, 30, 0.35)';
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // --- ゴール地点＆相棒キャラクターの応援演出 ---
  const canGoal = !boss || boss.defeated;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(goalX + 35, groundY);
  ctx.lineTo(goalX + 35, groundY - 125);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#2b2623';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(goalX + 35, groundY - 125);
  ctx.lineTo(goalX + 95, groundY - 105);
  ctx.lineTo(goalX + 35, groundY - 85);
  ctx.closePath();
  strokeAndFill(ctx, canGoal ? '#ffe066' : '#cccccc', 2.5);

  ctx.fillStyle = '#2b2623';
  ctx.font = '900 13px sans-serif';
  ctx.fillText('GOAL', goalX + 41, groundY - 100);

  const partnerBounce = Math.sin(globalTime * 6) * 4;
  if (selectedChar === 'sasamon') {
    drawWolfutan(ctx, goalX, groundY - 48 + partnerBounce, 1.0, -1, globalTime, false, 'IDLE');
  } else {
    drawSasamon(ctx, goalX, groundY - 48 + partnerBounce, 1.0, -1, globalTime, false, 'IDLE');
  }

  ctx.beginPath();
  ctx.roundRect(goalX - 64, groundY - 135 + partnerBounce, 128, 26, 10);
  strokeAndFill(ctx, '#ffffff', 2);
  ctx.fillStyle = '#2b2623';
  ctx.font = 'bold 11.5px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(canGoal ? 'こっちだよ〜！' : 'しみずっちをたおして！', goalX, groundY - 118 + partnerBounce);
  ctx.restore();

  // --- アイテム描画 ---
  for (const it of items) {
    const floatY = it.y + Math.sin(globalTime * 5 + it.x) * 4;
    ctx.save();
    ctx.translate(it.x, floatY);
    if (it.type === 'CANDY') {
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); strokeAndFill(ctx, '#ff9ec7', 2.2);
      ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(-17, -6); ctx.lineTo(-17, 6); ctx.closePath(); strokeAndFill(ctx, '#ffe066', 2);
      ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(17, -6); ctx.lineTo(17, 6); ctx.closePath(); strokeAndFill(ctx, '#ffe066', 2);
    } else if (it.type === 'PROTEIN') {
      ctx.beginPath(); ctx.roundRect(-10, -13, 20, 26, 4); strokeAndFill(ctx, '#9be0ff', 2.2);
      ctx.beginPath(); ctx.roundRect(-7, -17, 14, 4, 2); strokeAndFill(ctx, '#ffe066', 2);
      ctx.fillStyle = '#2b2623';
      ctx.font = '900 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('P', 0, 4);
    } else if (it.type === 'HEART') {
      ctx.beginPath();
      ctx.arc(-5, -3, 6, 0, Math.PI * 2);
      ctx.arc(5, -3, 6, 0, Math.PI * 2);
      ctx.lineTo(0, 11);
      ctx.closePath();
      strokeAndFill(ctx, '#ff6b8b', 2.2);
    }
    ctx.restore();
  }

  // --- 敵キャラクター描画 ---
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.hitFlash > 0) ctx.globalAlpha = 0.5;

    if (e.type === 'MOKO') {
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      strokeAndFill(ctx, '#d8c3ff', 2.3);
      ctx.fillStyle = '#1f1b18';
      ctx.beginPath(); ctx.arc(-6, -2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-9, -7); ctx.lineTo(-3, -4); ctx.moveTo(9, -7); ctx.lineTo(3, -4); ctx.lineWidth = 2; ctx.stroke();
    } else if (e.type === 'PYON') {
      ctx.beginPath(); ctx.ellipse(-6, -22, 4, 10, -0.15, 0, Math.PI * 2); strokeAndFill(ctx, '#ffd6a5', 2.2);
      ctx.beginPath(); ctx.ellipse(6, -22, 4, 10, 0.15, 0, Math.PI * 2); strokeAndFill(ctx, '#ffd6a5', 2.2);
      ctx.beginPath(); ctx.ellipse(0, 0, 19, 17, 0, 0, Math.PI * 2); strokeAndFill(ctx, '#ffd6a5', 2.3);
      ctx.fillStyle = '#1f1b18';
      ctx.beginPath(); ctx.arc(-6, -2, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -2, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'DUMBBELL') {
      ctx.beginPath(); ctx.roundRect(-22, -6, 44, 12, 4); strokeAndFill(ctx, '#adb5bd', 2.2);
      ctx.beginPath(); ctx.roundRect(-24, -18, 12, 36, 4); strokeAndFill(ctx, '#ff8fa3', 2.3);
      ctx.beginPath(); ctx.roundRect(12, -18, 12, 36, 4); strokeAndFill(ctx, '#ff8fa3', 2.3);
      ctx.fillStyle = '#1f1b18';
      ctx.beginPath(); ctx.arc(-4, 0, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, 0, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // --- ボス描画（ステージ3：しみずっち） ---
  if (boss && !boss.defeated) {
    const bossFacing = boss.vx > 0 ? -1 : 1; // 元画像のしっぽが左・向きが右寄りなのを進行方向に合わせる
    drawTanukiBoss(ctx, boss.x, boss.y, globalTime, boss.hitFlash, boss.hp, boss.maxHp, bossFacing);
  }

  // --- プレイヤーキャラクター描画 ---
  const isInvulnBlink = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 16) % 2 === 0;
  if (!isInvulnBlink) {
    const pState = !player.grounded ? 'JUMP' : (Math.abs(player.vx) > 0.5 ? 'RUN' : 'IDLE');
    if (selectedChar === 'sasamon') {
      drawSasamon(ctx, player.x, player.y, 1.0, player.facing, globalTime, player.attackTimer > 0, pState);
    } else {
      drawWolfutan(ctx, player.x, player.y, 1.0, player.facing, globalTime, player.attackTimer > 0, pState);
    }
  }

  // --- 攻撃エフェクト描画 ---
  for (const proj of projectiles) {
    ctx.save();
    ctx.translate(proj.x, proj.y);
    if (proj.type === 'SLIPPER_BEAM') {
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2);
      strokeAndFill(ctx, '#95e89b', 2.2);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(4, -2, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, 26, -Math.PI * 0.45, Math.PI * 0.45);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#1f1b18';
      ctx.stroke();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#c78cff';
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- パーティクル描画 ---
  for (const pt of particles) {
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    strokeAndFill(ctx, pt.color, 1.5);
  }

  ctx.restore();

  drawHUD();
}

function drawHUD() {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(12, 10, 240, 66, 14);
  strokeAndFill(ctx, 'rgba(255, 255, 255, 0.92)', 2.5);

  ctx.fillStyle = '#2b2623';
  ctx.font = '900 13px "Zen Maru Gothic", sans-serif';
  ctx.textAlign = 'left';
  const charLabel = selectedChar === 'sasamon' ? 'さーさもん' : 'うるふたん';
  const pwrLabel = player.powerLevel >= 2 ? ' ★POWER UP!' : '';
  ctx.fillText(`${charLabel}${pwrLabel}`, 24, 30);

  for (let i = 0; i < player.maxHp; i++) {
    const hx = 28 + i * 22;
    const hy = 46;
    ctx.beginPath();
    ctx.arc(hx - 4, hy, 5, 0, Math.PI * 2);
    ctx.arc(hx + 4, hy, 5, 0, Math.PI * 2);
    ctx.lineTo(hx, hy + 11);
    ctx.closePath();
    strokeAndFill(ctx, i < player.hp ? '#ff6b8b' : '#e0dcd7', 1.8);
  }

  ctx.fillStyle = '#2b2623';
  ctx.font = '900 14px "Zen Maru Gothic", sans-serif';
  ctx.fillText(`SCORE: ${score}`, 145, 53);

  if (canvas.width > 560) {
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 155, 10, 310, 32, 12);
    strokeAndFill(ctx, 'rgba(255, 255, 255, 0.92)', 2.2);
    ctx.fillStyle = '#2b2623';
    ctx.font = '900 13px "Zen Maru Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(stageTheme.name || '', canvas.width / 2, 31);
  }
  ctx.restore();
}

/**
 * ============================================================================
 * 7. メインアニメーションループ
 * ============================================================================
 */
let lastTimestamp = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
  lastTimestamp = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

window.onload = function () {
  resizeCanvas();
  renderPreviews();
  requestAnimationFrame(gameLoop);
};
</script>
</body>
</html>
